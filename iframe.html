
<!DOCTYPE html>
<html>
<head>
    <title>Three Section Iframe</title>
</head>
<body>
    <table width="100%" height="100%">
        <tr>
            <!-- First Section: 25% -->
            <td width="25%">
                <iframe src="https://www.wikipedia.org"
                        width="100%" height="1000">
                </iframe>
            </td>

            <!-- Second Section: 50% -->
            <td width="50%">
                <iframe src="https://www.youtube.com/embed/aqz-KE-bpKQ"
                        width="100%" height="1000">
                </iframe>
            </td>

            <!-- Third Section: 25% -->
            <td width="25%">
                <iframe src="https://www.example.com"
                        width="100%" height="1000">
                </iframe>
            </td>
        </tr>
    </table>
</body>
</html>
